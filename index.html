<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fafafa"><meta name="description" content="tria. Três tarefas. Um tempo. Um timer gratuito e minimalista para focar no que importa agora."><meta property="og:title" content="tria — três tarefas. um tempo."><meta property="og:description" content="Seu tempo, com menos distração. Timer, tags e apenas três tarefas."><title>tria — três tarefas. um tempo.</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><script src="./theme.js"></script><link rel="stylesheet" href="./style.css"><script src="./app.js" defer></script><script src="./ambient.js" defer></script></head>
<body><header><a href="./" class="brand" aria-label="tria, início">tria<span class="brand-mark" aria-hidden="true">///</span></a><div class="header-tools"><span class="header-note">um pouco de foco.</span><label class="theme-picker"><span class="sr-only">Tema de aparência</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg><select id="theme" aria-label="Tema de aparência"><option value="system">Automático</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label></div></header>
<main><section class="focus" aria-label="Timer de foco"><div class="session-heading"><span class="eyebrow">TEMPO PARA O AGORA</span><span id="status" role="status">Tudo no seu tempo</span></div><div class="duration"><button class="duration-choice active" data-min="25" aria-pressed="true">25 min</button><button class="duration-choice" data-min="45" aria-pressed="false">45 min</button><button class="duration-choice" data-min="60" aria-pressed="false">60 min</button><button id="custom" aria-expanded="false">Personalizar</button></div><form id="custom-form" hidden><label for="minutes">Minutos</label><input id="minutes" type="number" min="1" max="180" value="25" required><button type="submit">Definir</button></form><div id="clock" role="timer" aria-label="25 minutos restantes">25<span>:</span>00</div><div class="timer-track" aria-hidden="true"><div id="elapsed"></div></div><div class="controls"><button id="toggle" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7z"/></svg><span>Iniciar</span></button><button id="reset" class="reset" aria-label="Reiniciar timer" title="Reiniciar timer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button></div><div class="ambient" aria-label="Som ambiente"><button id="sound-toggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4m4-7v10m4-13v16m4-13v10m4-7v4"/></svg><span>Ruído marrom</span><span id="sound-state">Desligado</span></button><label class="volume-control" for="sound-volume"><span class="sr-only">Volume do ruído marrom</span><input id="sound-volume" type="range" min="0" max="100" value="25" aria-valuetext="25%"><output id="volume-value" for="sound-volume">25%</output></label></div><p id="sound-feedback" class="sr-only" role="status"></p><div class="tags-area"><span class="tag-label">Foco em</span><div id="tags" aria-label="Tags da sessão"></div><button id="new-tag" aria-expanded="false">+ Criar tag</button></div><form id="tag-form" hidden><label class="sr-only" for="tag-name">Nome da tag</label><input id="tag-name" placeholder="Nome da tag" maxlength="24" required autocomplete="off"><button type="submit">Criar</button></form><p id="tag-feedback" class="feedback" role="status"></p></section>
<section class="tasks" aria-labelledby="tasks-title"><div class="tasks-heading"><div><h1 id="tasks-title">Só o essencial.</h1><p>Três tarefas. Uma de cada vez.</p></div><span id="count">0 / 3</span></div><div id="task-list"></div><div class="tasks-footer"><span id="task-note" role="status">O primeiro passo cabe em uma linha.</span><span class="three-bars" aria-hidden="true">Ⅰ Ⅰ Ⅰ</span></div></section></main>
<footer><span>três tarefas. um tempo.</span><span>feito para fazer menos, melhor.</span></footer></body></html>
